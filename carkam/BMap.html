    <script type="text/javascript">

    var map;
    var marker;
    var poly;
    var path,pathDrived;
    var poly, polyDrived;
    var debug = 1;
    var first = 1;
    function initialize() {
        var point = new BMap.Point(0,0);
        //var point = new BMap.Point(139.8107, 35.7101); // ҳЫ�I§��
        map = new BMap.Map("container");         // �ЫMapع�
        marker = new BMap.Marker(point);
        map.centerAndZoom(point, 16);                // Ъl쩤Ʀa�,ϳ]�m����I§��ЩM�a�ϯŧO�C	
        NavigationControl = new BMap.NavigationControl(BMAP_NAVIGATION_CONTROL_LARGE); //Y��Ф	
        map.addControl(NavigationControl);
        map.enableScrollWheelZoom();                  // رҥκu��j�Y�p�C
        map.enableKeyboard();                         // �ҥ��L佾ާ@�C

        path = new Array();
        pathDrived = new Array();

        poly = new BMap.Polyline(path, { strokeColor: "blue", strokeWeight: 6, strokeOpacity: 0.5 });
        map.addOverlay(poly);

        polyDrived = new BMap.Polyline(pathDrived, { strokeColor: "red", strokeWeight: 6, strokeOpacity: 0.5 });
        map.addOverlay(polyDrived);

    }
        
	function movpos(y,x,h){
		//delete point;
	    var point = new BMap.Point(x, y);

        BMap.Convertor.translate(point,0,translateCallback);
        /*
        map.removeOverlay(marker);
        marker = new BMap.Marker(point);        
        map.addOverlay(marker);
		map.centerAndZoom(point,map.getZoom());                     // �l쩤Ʀa�,ϳ]�m����I§��ЩM�a�ϯŧO�C				
		*/
	}

	translateCallback = function(point) {
	    //alert(point.lng + "," + point.lat);			
	    map.removeOverlay(marker);
	    marker = new BMap.Marker(point);
	    map.addOverlay(marker);
	    map.centerAndZoom(point, map.getZoom());                     // �l쩤Ʀa�,ϳ]�m����I§��ЩM�a�ϯŧO�C

        pathDrived.push(point);
        polyDrived.setPath(pathDrived);

	}

    function path_plot(y,x) {
        var point = new BMap.Point(x, y);
        BMap.Convertor.translate(point, 0, path_plot_callback);
    }

    path_plot_callback = function(point) {

        path.push(point);
        poly.setPath(path);
    }

    function path_delete() {
        path = [];
        poly.setPath(path);
    }

    function pathdrived_plot(y, x) {
        var point = new BMap.Point(x, y);
        BMap.Convertor.translate(point, 0, pathdrived_plot_callback);    
    }

    pathdrived_plot_callback = function(point) {

        pathDrived.push(point);
        polyDrived.setPath(pathDrived);
    }

    function pathdrived_delete() {
        pathDrived = [];
        polyDrived.setPath(pathDrived);
    }
   
    
    </script>
